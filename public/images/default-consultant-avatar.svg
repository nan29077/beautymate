<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="사주메이트 기본 상담사 프로필">
  <defs>
    <linearGradient id="sm-av-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E1A5E" />
      <stop offset="55%" stop-color="#4A2C9B" />
      <stop offset="100%" stop-color="#6849D8" />
    </linearGradient>
    <linearGradient id="sm-av-moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8" />
      <stop offset="100%" stop-color="#F5A700" />
    </linearGradient>
    <mask id="sm-av-crescent">
      <rect width="512" height="512" fill="#000" />
      <circle cx="248" cy="252" r="96" fill="#fff" />
      <circle cx="296" cy="214" r="86" fill="#000" />
    </mask>
  </defs>

  <!-- 밤하늘 원형 배경 -->
  <circle cx="256" cy="256" r="256" fill="url(#sm-av-bg)" />
  <circle cx="256" cy="256" r="243" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6" />

  <!-- 초승달 -->
  <g mask="url(#sm-av-crescent)">
    <rect width="512" height="512" fill="url(#sm-av-moon)" />
  </g>

  <!-- 별 (4각 스파클) -->
  <g fill="#FFFFFF">
    <path d="M150 132c4 22 8 26 30 30-22 4-26 8-30 30-4-22-8-26-30-30 22-4 26-8 30-30Z" opacity="0.92" />
    <path d="M370 330c3.2 17.6 6.4 20.8 24 24-17.6 3.2-20.8 6.4-24 24-3.2-17.6-6.4-20.8-24-24 17.6-3.2 20.8-6.4 24-24Z" opacity="0.7" />
    <path d="M118 316c2.4 13.2 4.8 15.6 18 18-13.2 2.4-15.6 4.8-18 18-2.4-13.2-4.8-15.6-18-18 13.2-2.4 15.6-4.8 18-18Z" opacity="0.55" />
  </g>

  <!-- 작은 별점 -->
  <g fill="#FFE9A8">
    <circle cx="392" cy="150" r="7" opacity="0.85" />
    <circle cx="332" cy="96" r="4.5" opacity="0.6" />
    <circle cx="96" cy="228" r="4.5" opacity="0.5" />
    <circle cx="236" cy="404" r="5.5" opacity="0.6" />
    <circle cx="300" cy="378" r="3.5" opacity="0.45" />
  </g>
</svg>
