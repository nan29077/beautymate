<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 배경 -->
  <rect width="64" height="64" rx="14" fill="#F59E0B"/>

  <!-- 왼쪽 날개 (라인형) -->
  <ellipse cx="20" cy="22" rx="10" ry="6" transform="rotate(-25 20 22)"
    fill="none" stroke="white" stroke-width="2.2" opacity="0.9"/>

  <!-- 오른쪽 날개 (라인형) -->
  <ellipse cx="44" cy="22" rx="10" ry="6" transform="rotate(25 44 22)"
    fill="none" stroke="white" stroke-width="2.2" opacity="0.9"/>

  <!-- 더듬이 왼쪽 -->
  <path d="M26 18 Q22 10 18 8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="17.5" cy="7.5" r="2" fill="white"/>

  <!-- 더듬이 오른쪽 -->
  <path d="M38 18 Q42 10 46 8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46.5" cy="7.5" r="2" fill="white"/>

  <!-- 몸통 (타원형, 라인형) -->
  <ellipse cx="32" cy="40" rx="13" ry="14"
    fill="none" stroke="white" stroke-width="2.4"/>

  <!-- 머리 -->
  <ellipse cx="32" cy="26" rx="8" ry="7"
    fill="none" stroke="white" stroke-width="2.2"/>

  <!-- 줄무늬 1 -->
  <path d="M20 36 Q32 33 44 36" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- 줄무늬 2 -->
  <path d="M20 43 Q32 40 44 43" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- 침 -->
  <path d="M32 54 L32 58" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
